/* Pull the summary for every game on the board so the list itself carries
   real numbers. Free — it's the same endpoint one game at a time. */
async function sweepBoard(games, onProgress) {
  const out = {};
  let done = 0, idx = 0;
  const worker = async () => {
    while (idx < games.length) {
      const g = games[idx++];
      if (g.espnId) {
        try {
          const d = parseSummary(await espnGet("/summary?event=" + g.espnId, 15000),
                                 g.hAb, g.aAb);
          const books = (d.pick || []).filter((b) => b.sp != null);
          const tots = (d.pick || []).filter((b) => b.tot != null);
          if (books.length || tots.length || d.espnWp != null) {
            const spAvg = books.length
              ? books.reduce((a, b) => a + b.sp, 0) / books.length : null;
            const totAvg = tots.length
              ? tots.reduce((a, b) => a + b.tot, 0) / tots.length : null;
            const mktMu = spAvg != null ? -spAvg : null;
            const modelMu = d.espnWp != null ? -modelLine(d.espnWp) : null;
            out[g.id] = {
              sum: d,
              sp: spAvg, tot: totAvg, n: books.length, wp: d.espnWp,
              gap: mktMu != null && modelMu != null ? modelMu - mktMu : null,
              inj: (d.injuries || []).reduce((a, t) => a + t.list.length, 0),
            };
          }
        } catch (e) { /* skip and keep going */ }
      }
      onProgress(++done, games.length);
    }
  };
  await Promise.all([0,0,0,0,0,0,0,0].map(worker));
  return out;
}

function Insight({ game, entry, patch }) {
  const [mk, setMk] = useState("sp");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [showGrid, setShowGrid] = useState(false);
  const loaded = React.useRef(false);

  const sum = entry.sum || null;
  const def = MARKETS.find((m) => m.k === mk);
  const rows = entry[mk] || {};
  // Power de-vig always: proportional badly overstates heavy favorites,
  // and college football is full of them.
  const res = useMemo(() => shop(mk, game, rows, devigPower),
    [mk, rows, game]);

  // Everything below loads itself, free, the moment the game opens.
  const load = async () => {
    if (!game.espnId) { setErr("no-espn"); return; }
    setBusy(true); setErr(null);
    try {
      const d = parseSummary(await espnGet("/summary?event=" + game.espnId), game.hAb, game.aAb);
      const ml = {}, sp = {}, tot = {}, names = {};
      for (const bk of d.pick || []) {
        names[bk.k] = bk.name;
        if (bk.mlA != null && bk.mlB != null) ml[bk.k] = { a: String(bk.mlA), b: String(bk.mlB) };
        if (bk.sp != null) sp[bk.k] = { l: String(bk.sp), a: String(bk.spA ?? -110), b: String(bk.spB ?? -110) };
        if (bk.tot != null) tot[bk.k] = { l: String(bk.tot), a: String(bk.ovr ?? -110), b: String(bk.und ?? -110) };
      }
      patch((prev) => ({
        ...prev, sum: d, bookNames: { ...(prev.bookNames || {}), ...names },
        ml: { ...(prev.ml || {}), ...ml }, sp: { ...(prev.sp || {}), ...sp },
        tot: { ...(prev.tot || {}), ...tot },
        oddsAt: Date.now(),
      }));
    } catch (e) { setErr("fetch"); }
    finally { setBusy(false); }
  };

  useEffect(() => {
    if (loaded.current) return;
    loaded.current = true;
    if (!sum) load();
  }, [game.id]);

  const set = (k, f, v) =>
    patch((prev) => {
      const cur = prev[mk] || {};
      return { ...prev, [mk]: { ...cur, [k]: { ...(cur[k] || {}), [f]: v } } };
    });

  const mLabel = (mu) => {
    const L = -mu;
    return `${L <= 0 ? game.hAb : game.aAb} −${trim(Math.abs(L))}`;
  };
  const mColor = (mu) => (-mu <= 0 ? tc(game, "h") : tc(game, "a"));
  const evTxt = (e) => (e >= 0 ? "+" : "") + (e * 100).toFixed(1) + "%";
  const evCls = (e) => (e > 0.005 ? "p" : e < -0.005 ? "n" : "z");
  const pct = (x) => (x * 100).toFixed(1) + "%";

  const feedMu = game.wp != null ? -modelLine(game.wp) : null;
  const espnMu = sum && sum.espnWp != null ? -modelLine(sum.espnWp) : null;
  const mktMu = res && mk === "sp" ? res.cons : null;

  // What the half point around this line is actually worth.
  const kn = (() => {
    if (mk !== "sp" || !res || mktMu == null) return null;
    const L = res.bestB.L;
    if (L == null) return null;
    const near = [3, 7, 10, 14, 17, 21].filter((k) => Math.abs(Math.abs(L) - k) <= 1.0);
    const v = halfPointValue(mktMu, L, SIG_M);
    return { L, near, v, cents: centsOf(v), onKey: Number.isInteger(L),
             mass: massAt(mktMu, Math.abs(Math.round(L)), SIG_M) };
  })();

  // The verdict is arithmetic on the numbers above, not a generated opinion.
  const verdict = () => {
    if (mktMu == null || !res) return null;
    const models = [feedMu, espnMu].filter((x) => x != null);
    if (!models.length) return null;
    const avg = models.reduce((a, b) => a + b, 0) / models.length;
    const gap = avg - mktMu;

    // How much disagreement it takes before this counts as anything. One
    // model has nothing to cross-check it; one book isn't a market.
    const band = models.length > 1 ? Math.abs(models[0] - models[1]) : 4;
    let need = Math.max(band / 2, 1.5);
    const thin = [];
    if (models.length === 1) {
      need += 1;
      thin.push("only one model, so there's nothing to cross-check it against");
    }
    if (res.count === 1) {
      need += 1;
      thin.push(`only one book posted, so "market" here means ${
        (entry.bookNames || {})[res.bestB.bk.k] || res.bestB.bk.n} on its own`);
    }
    const caveat = thin.length ? ` Thin evidence though — ${thin.join(", and ")}.` : "";

    if (Math.abs(gap) <= need) {
      return { tone: "z", head: "Nothing worth betting here.",
        body: `Models average ${mLabel(avg)}, market is ${mLabel(mktMu)} — ` +
          `${Math.abs(gap).toFixed(1)} points apart, inside the ${need.toFixed(1)} it would take ` +
          `to mean anything.` + caveat };
    }
    const side = gap > 0 ? game.home : game.away;
    return { tone: gap > 0 ? "p" : "n",
      head: `Models like ${side} by ${Math.abs(gap).toFixed(1)} more than the market.`,
      body: `Models average ${mLabel(avg)}, market is ${mLabel(mktMu)}.` + caveat +
        (kn && kn.near.length
          ? ` The line sits near ${kn.near[0]}, where half a point is worth ${
              (kn.v * 100).toFixed(1)}% — check the key-number panel before paying to move it.`
          : "") };
  };
  const v = verdict();

  // bestA and bestB can come from different books quoting different
  // numbers — that gap is either a middle (both bets cash) or a dead zone
  // (both lose), computed in shop() itself.
  const midHint = (() => {
    if (!res || !res.middle) return null;
    const bkA = (entry.bookNames || {})[res.bestA.bk.k] || res.bestA.bk.n;
    const bkB = (entry.bookNames || {})[res.bestB.bk.k] || res.bestB.bk.n;
    const unit = mk === "sp" ? "margin" : "total";
    const range = `${trim(res.middle.lo)}–${trim(res.middle.hi)}${mk === "tot" ? " points" : ""}`;
    return res.middle.bothWin
      ? `${bkA} and ${bkB} quote different numbers here. If the ${unit} lands ${range}, both ` +
        `${res.sideA} and ${res.sideB} cash — about ${pct(res.middle.mass)} of outcomes land there.`
      : `${bkA} and ${bkB} quote different numbers here, the wrong way. If the ${unit} lands ${range}, ` +
        `both ${res.sideA} and ${res.sideB} lose — about ${pct(res.middle.mass)} of outcomes do. ` +
        `That's the cost of taking each side's best number from a different book.`;
  })();

  const marks = [];
  if (mk === "sp") {
    if (feedMu != null) marks.push({ k: "Feed", v: feedMu, txt: mLabel(feedMu), c: mColor(feedMu) });
    if (espnMu != null) marks.push({ k: "ESPN", v: espnMu, txt: mLabel(espnMu), c: mColor(espnMu) });
    if (res && res.openAnchor != null) marks.push({ k: "Open", v: res.openAnchor, txt: mLabel(res.openAnchor), c: "#E3B448" });
    if (mktMu != null) marks.push({ k: "Market", v: mktMu, txt: mLabel(mktMu), c: "#FFFFFF" });
  }

  const injOf = (ab) => {
    const t = (sum && sum.injuries || []).find((x) => x.ab === ab);
    return t ? t.list : [];
  };

  const teamBlock = (ab, name, side) => {
    const ats = sum ? (side === "h" ? sum.hAts : sum.aAts) : null;
    const form = sum ? (side === "h" ? sum.hForm : sum.aForm) : null;
    const inj = injOf(ab);
    const sp = side === "h" ? game.hSplits : game.aSplits;
    const rt = EMP && EMP.rat ? EMP.rat[ab] : null;
    return (
      <div className="side" style={{ borderLeftColor: tc(game, side) }}>
        <span className="sname" style={{ color: tc(game, side) }}>{name}</span>
        <span className="srec">
          {[side === "h" ? game.hRec : game.aRec,
            sp && sp.conf ? sp.conf + " conf" : null,
            sp && (side === "h" ? sp.home : sp.road)
              ? (side === "h" ? sp.home + " home" : sp.road + " away") : null,
            ats ? "ATS " + ats : null]
            .filter(Boolean).join(" · ") || "no record yet"}
        </span>
        {rt && (
          <div className="ratings">
            <span><b>{rt.r >= 0 ? "+" : ""}{rt.r.toFixed(1)}</b>rating{
              rt.rank ? ` · #${rt.rank}` : ""}</span>
            <span><b>{rt.off.toFixed(1)}</b>adj off</span>
            <span><b>{rt.def.toFixed(1)}</b>adj def</span>
            <span><b>{rt.sos >= 0 ? "+" : ""}{rt.sos.toFixed(1)}</b>schedule</span>
          </div>
        )}
        {form && form.length > 0 && (
          <div className="form">
            {form.map((f, i) => (
              <span key={i} className={"pill " + (f.res === "W" ? "w" : "l")}>
                {f.res} {f.score}{f.opp ? " " + f.opp : ""}
              </span>
            ))}
          </div>
        )}
        {inj.length > 0 ? (
          <ul className="facts">
            {inj.slice(0, 5).map((i, n) => (
              <li key={n}><b>{i.who}</b> {i.pos ? "(" + i.pos + ")" : ""} — {i.status}</li>
            ))}
          </ul>
        ) : sum ? <p className="nofact">No injuries reported.</p> : null}
      </div>
    );
  };

  return (
    <div className="desk">
      {busy && !sum && (
        <>
          <p className="empty">Loading the game from ESPN…</p>
          {[...Array(3)].map((_, i) => <div className="skel" key={i} />)}
        </>
      )}

      {err && !sum && (
        <p className="empty">
          {err === "no-espn"
            ? "This game came from the built-in snapshot, so there's no ESPN record to pull."
            : "ESPN didn't return a game record. Nothing to show but the odds grid below."}
        </p>
      )}

      {v && (
        <div className={"verdict " + v.tone}>
          <span className="vh">{v.head}</span>
          <span className="vb">{v.body}</span>
        </div>
      )}

      {sum && (sum.venue || sum.weather) && (
        <p className="strip">
          {sum.venue}{sum.city ? " · " + sum.city : ""}
          {sum.weather && <> · {sum.weather.t != null ? sum.weather.t + "°" : ""} {sum.weather.d}</>}
          {sum.series && <> · {sum.series}</>}
        </p>
      )}

      <div style={{ margin: "4px 0 14px" }}>
        <Seg value={mk} onChange={setMk} options={MARKETS.map((m) => ({ v: m.k, l: m.label }))} />
      </div>

      {res ? (
        <div className="out">
          <p className="hint">
            {res.count === 1
              ? `Only ${(entry.bookNames || {})[res.bestB.bk.k] || res.bestB.bk.n} has posted this game, so there's nothing to shop against yet.`
              : `Best of ${res.count} books, priced against the ${res.usePin ? "Pinnacle" : "consensus"} number. Loaded free from ESPN.`}
          </p>
          <div className="pick">
            <span className="lft">
              <b style={{ color: mk === "tot" ? "#F2F5FA" : tc(game, "a") }}>{res.sideA}</b>{" "}
              <span className="num">
                {def.line && (mk === "sp" ? (res.bestA.L > 0 ? "−" : "+") + trim(Math.abs(res.bestA.L)) : "o" + res.bestA.L)}{" "}
                {fmtOdds(parseFloat(res.bestA.oa))}
              </span>
              <em>{(entry.bookNames || {})[res.bestA.bk.k] || res.bestA.bk.n}</em>
            </span>
            <span className={"ev " + (res.count === 1 ? "z" : evCls(res.bestA.evA))}>
              {res.count === 1 ? "—" : evTxt(res.bestA.evA)}</span>
          </div>
          <div className="pick">
            <span className="lft">
              <b style={{ color: mk === "tot" ? "#F2F5FA" : tc(game, "h") }}>{res.sideB}</b>{" "}
              <span className="num">
                {def.line && (mk === "sp" ? (res.bestB.L > 0 ? "+" : "−") + trim(Math.abs(res.bestB.L)) : "u" + res.bestB.L)}{" "}
                {fmtOdds(parseFloat(res.bestB.ob))}
              </span>
              <em>{(entry.bookNames || {})[res.bestB.bk.k] || res.bestB.bk.n}</em>
            </span>
            <span className={"ev " + (res.count === 1 ? "z" : evCls(res.bestB.evB))}>
              {res.count === 1 ? "—" : evTxt(res.bestB.evB)}</span>
          </div>
          <div className="rule">
            <div className="kv"><span>{res.usePin ? "Pinnacle" : "Consensus"}</span>
              <b style={{ color: mk === "sp" ? mColor(res.cons) : "#F2F5FA" }}>
                {mk === "ml" ? `${game.hAb} ${fmtOdds(toAmerican(res.cons))}`
                  : mk === "sp" ? mLabel(res.cons) : res.cons.toFixed(1)}
              </b></div>
            <div className="kv"><span>Cost if you shop</span>
              <b style={{ color: res.shoppedCost <= 0 ? "#35D07F" : "#E3B448" }}>{pct(res.shoppedCost)}</b></div>
            {res.count > 1 && (
              <div className="kv"><span>Cost at your worst book</span>
                <b style={{ color: "#FF5A47" }}>{pct(res.worstHold)}</b></div>
            )}
            {res.middle && (
              <div className="kv"><span>{res.middle.bothWin ? "Middle" : "Dead zone"}</span>
                <b style={{ color: res.middle.bothWin ? "#35D07F" : "#FF5A47" }}>
                  {trim(res.middle.lo)}–{trim(res.middle.hi)}{mk === "tot" ? " pts" : ""}
                  {" "}({pct(res.middle.mass)})
                </b></div>
            )}
          </div>
          {res.count === 1 ? (
            <p className="hint" style={{ margin: "11px 0 0", paddingTop: 11, borderTop: "1px solid #28303F" }}>
              Expected value is blank on purpose. With a single book the benchmark would be that
              same book, so the number would just be its own {pct(res.shoppedCost)} vig handed
              back to you as though it were analysis. It means something once a second book posts.
            </p>
          ) : res.bestA.evA < 0 && res.bestB.evB < 0 && (
            <p className="hint" style={{ margin: "11px 0 0", paddingTop: 11, borderTop: "1px solid #28303F" }}>
              Both sides negative is normal — every price carries vig and the benchmark is these
              same books averaged. A bet clears zero only when one book sits far enough off the
              others to beat its own juice.
            </p>
          )}
          {midHint && (
            <p className="hint" style={{ margin: "11px 0 0", paddingTop: 11, borderTop: "1px solid #28303F" }}>
              {midHint}
            </p>
          )}
        </div>
      ) : !busy && (
        <p className="empty">No book has posted this game. Common for small-school matchups —
          they often never get a market at all.</p>
      )}

      {kn && (
        <div className="keybox">
          <span className="role">Key numbers</span>
          <span className="kh">
            {kn.onKey
              ? `The line is sitting on ${Math.abs(kn.L)}.`
              : kn.near.length
                ? `Half a point off ${kn.near[0]}.`
                : `No key number nearby.`}
          </span>
          <p className="kb">
            {(kn.mass * 100).toFixed(1)}% of games with this projected margin land exactly on{" "}
            {Math.abs(Math.round(kn.L))}. Moving this line half a point is worth{" "}
            <b>{(kn.v * 100).toFixed(1)}%</b> — about <b>{Math.round(kn.cents)} cents</b> of price.
            {kn.v > 0.018
              ? " That's an expensive half point. Paying more than that to buy it loses money."
              : " That's a cheap half point, so the number matters less than the price here."}
          </p>
          <p className="kb dim">
            Priced off a discrete margin distribution weighted toward 3 and 7, not a normal
            curve — which is why this number isn't flat across the board.
          </p>
        </div>
      )}

      {mk === "sp" && marks.length >= 2 && (
        <div className="field" style={{ marginTop: 16 }}>
          <h4>Models against the market</h4>
          <Track marks={marks} />
        </div>
      )}

      {(sum || game.hRec) && (
        <div className="facts-wrap" style={{ marginTop: 16 }}>
          {teamBlock(game.aAb, game.away, "a")}
          {teamBlock(game.hAb, game.home, "h")}
        </div>
      )}

      <button className="collapse" onClick={() => setShowGrid(!showGrid)}>
        {showGrid ? "▾" : "▸"} Odds grid{res ? ` · ${res.count} books` : " · empty"} · edit by hand
      </button>
      {showGrid && (<>
        <div className={"grid cap " + (def.line ? "w4" : "w3")}>
          <span>Book</span>
          {def.line && <span>{mk === "sp" ? "Home" : "Total"}</span>}
          <span>{mk === "tot" ? "Over" : game.aAb}</span>
          <span>{mk === "tot" ? "Under" : game.hAb}</span>
        </div>
        <div className={"grid openrow " + (def.line ? "w4" : "w3")}>
          <span className="bk op">OPEN</span>
          {def.line && <input className="f" inputMode="decimal" value={(rows.open || {}).l || ""}
            placeholder="line" onChange={(e) => set("open", "l", e.target.value)} />}
          <input className="f" inputMode="text" value={(rows.open || {}).a || ""} placeholder="odds"
            onChange={(e) => set("open", "a", e.target.value)} />
          <input className="f" inputMode="text" value={(rows.open || {}).b || ""} placeholder="odds"
            onChange={(e) => set("open", "b", e.target.value)} />
        </div>
        {BOOKS.map((bk) => {
          const r = rows[bk.k] || {};
          return (
            <div className={"grid " + (def.line ? "w4" : "w3")} key={bk.k} style={{ marginBottom: 6 }}>
              <span className="bk" title={(entry.bookNames || {})[bk.k] || bk.n}>
                {((entry.bookNames || {})[bk.k] || bk.s).slice(0, 5)}
              </span>
              {def.line && <input className="f" inputMode="decimal" value={r.l || ""}
                placeholder="line" onChange={(e) => set(bk.k, "l", e.target.value)} />}
              <input className="f" inputMode="text" value={r.a || ""} placeholder="odds"
                data-best={res && res.bestA.bk.k === bk.k ? "1" : "0"}
                onChange={(e) => set(bk.k, "a", e.target.value)} />
              <input className="f" inputMode="text" value={r.b || ""} placeholder="odds"
                data-best={res && res.bestB.bk.k === bk.k ? "1" : "0"}
                onChange={(e) => set(bk.k, "b", e.target.value)} />
            </div>
          );
        })}
      </>)}

      <button className="pull" onClick={load} disabled={busy}>
        {busy ? "Refreshing…" : "Refresh from ESPN (free)"}
      </button>

      <ReadGame game={game} saved={entry.read}
        save={(x) => patch((prev) => ({ ...prev, read: x }))}
        ctx={[
          `Game: ${game.away} at ${game.home}, ${game.kick}`,
          feedMu != null ? `Feed model: ${mLabel(feedMu)}` : null,
          espnMu != null ? `ESPN projection: ${mLabel(espnMu)} (${sum.espnWp}% home)` : null,
          mktMu != null ? `Market consensus: ${mLabel(mktMu)}` : null,
          res ? `${res.count} books. Shopped cost ${(res.shoppedCost * 100).toFixed(1)}%.` : null,
          sum && sum.hAts ? `${game.hAb} ATS ${sum.hAts}` : null,
          sum && sum.aAts ? `${game.aAb} ATS ${sum.aAts}` : null,
          (sum && sum.injuries || []).map((t) =>
            `${t.ab} out/questionable: ${t.list.map((i) => i.who + " (" + i.status + ")").join(", ")}`).join("\n") || null,
          sum && sum.weather ? `Weather: ${sum.weather.t ?? ""} ${sum.weather.d}` : null,
          sum && sum.series ? `Series: ${sum.series}` : null,
          `Caveat: spreads convert through a normal curve (σ=${SIG_M}), which misprices 3 and 7.`,
        ].filter(Boolean).join("\n")} />
    </div>
  );
}

function LineDesk() {
  const [tab, setTab] = useState("upcoming");
  const [open, setOpen] = useState(null);
  const [entries, setEntries] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [now, setNow] = useState(() => new Date());
  // Polling pauses when the app isn't visible — backgrounded on a phone, or
  // buried behind another tab — and resumes on return. No control needed.
  const [live, setLive] = useState(
    () => (typeof document === "undefined" ? true : !document.hidden));

  useEffect(() => {
    const onVis = () => setLive(!document.hidden);
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("focus", onVis);
    window.addEventListener("blur", onVis);
    return () => {
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("focus", onVis);
      window.removeEventListener("blur", onVis);
    };
  }, []);
  const [espnGames, setEspnGames] = useState(null);
  const [emp, setEmp] = useState(null);
  const [pace, setPace] = useState(null);
  const [boardOdds, setBoardOdds] = useState({});
  const [sweeping, setSweeping] = useState(false);
  const [sweptDay, setSweptDay] = useState(null);
  const [sweptAt, setSweptAt] = useState(null);
  const sweepTried = React.useRef(false);
  const [weekGames, setWeekGames] = useState([]);
  const [log, setLog] = useState([]);

  const [autoCal, setAutoCal] = useState(null);   // null | "running" | "done" | "failed"
  const calTried = React.useRef(false);

  useEffect(() => {
    if (!loaded || calTried.current) return;
    const age = emp && emp.at ? Date.now() - emp.at : Infinity;
    const stale = age > 7 * 24 * 3600000;          // ratings drift every week
    if (emp && !stale) return;
    calTried.current = true;
    setAutoCal("running");
    (async () => {
      try {
        const d = await calibrate(seasonsBack(emp ? 2 : 3), () => {});
        EMP = d; setEmp(d); setAutoCal("done");
        try { await window.storage.set("linedesk:margins", JSON.stringify(d)); } catch (e) {}
      } catch (e) { setAutoCal("failed"); }
    })();
  }, [loaded, emp]);

  const logPicks = (picks, d) => {
    setLog((prev) => {
      const seen = new Set(prev.map((r) => r.key));
      const add = picks.filter((c) => !seen.has(pickKey(c))).map((c) => toRecord(c, d));
      if (!add.length) return prev;
      const next = [...add, ...prev].slice(0, 500);
      try { window.storage.set("linedesk:log", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  };
  const [openLive, setOpenLive] = useState(null);
  const [sweepProg, setSweepProg] = useState([0, 0]);
  const [sort, setSort] = useState("time");
  const [onlyMkt, setOnlyMkt] = useState(false);
  const [today, setToday] = useState([]);
  const [espnAt, setEspnAt] = useState(null);
  const [espnErr, setEspnErr] = useState(null);
  // Default to today when today is part of the week, otherwise Saturday.
  const [day, setDay] = useState(() => {
    const wk = footballWeek(new Date());
    const today = dayKey(new Date());
    return wk.some((w) => w.v === today) ? today : wk[2].v;
  });
  const loading = React.useRef(false);

  const loadBoard = async (d) => {
    if (loading.current) return;
    loading.current = true;
    try {
      const g = parseBoard(await espnGet(`/scoreboard?dates=${d}&limit=300`));
      setEspnGames(g); setEspnAt(Date.now()); setEspnErr(null);
      cache.set("board:" + d, g);
    } catch (e) {
      const c = await cache.get("board:" + d, 24 * 3600000);
      if (c && !c.stale) { setEspnGames(c.data); setEspnAt(c.at); }
      setEspnErr(e.blocked
        ? "blocked"
        : "ESPN answered with an error: " + (e.message || "unknown"));
    } finally { loading.current = false; }
  };

  useEffect(() => { setEspnGames(null); loadBoard(day); }, [day]);


  // One scoreboard call carries scores, status, records and ranks, so
  // polling it covers the whole live feed for free.
  useEffect(() => {
    if (!live || !espnGames) return;
    if (!espnGames.some((g) => g.state === "in")) return;
    const t = setInterval(() => loadBoard(day), 30000);
    return () => clearInterval(t);
  }, [live, espnGames, day]);

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 20000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("linedesk:odds");
        if (r && r.value) setEntries(JSON.parse(r.value));
        try {
          const m = await window.storage.get("linedesk:margins");
          if (m && m.value) { const d = JSON.parse(m.value); EMP = d; setEmp(d); }
        } catch (e) { /* built-in estimates stand in */ }
        try {
          const pc = await window.storage.get("linedesk:pace");
          if (pc && pc.value) { const d = JSON.parse(pc.value); PACE = d; setPace(d); }
        } catch (e) { /* no pace data */ }
        try {
          const lg = await window.storage.get("linedesk:log");
          if (lg && lg.value) setLog(JSON.parse(lg.value));
        } catch (e) { /* no saved record */ }
        try {
          const bd = await window.storage.get("linedesk:board");
          if (bd && bd.value) {
            const o = JSON.parse(bd.value);
            // Only restore it for the day it was taken on.
            if (o && o.odds && Date.now() - o.at < 6 * 3600000) {
              setBoardOdds(o.odds); setSweptDay(o.day); setSweptAt(o.at);
              if (o.games) setWeekGames(o.games);
            }
          }
        } catch (e) { /* no saved sweep */ }
      } catch (e) { /* nothing saved */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try { await window.storage.set("linedesk:odds", JSON.stringify(entries)); }
      catch (e) { /* memory only */ }
    })();
  }, [entries, loaded]);

  const patch = (id) => (v) =>
    setEntries((e) => ({ ...e, [id]: typeof v === "function" ? v(e[id] || {}) : v }));

  const board = espnGames && espnGames.length ? espnGames : UPCOMING;
  const onEspn = !!(espnGames && espnGames.length);
  // Live games come from the current-day feed, not the day you're browsing.
  const pool = today.length ? today : board;
  const inPlay = pool.filter((g) =>
    g.state ? g.state === "in" : phaseOf(g.kickAt, now) === "live");
  // One sweep, callable from the board or the card.
  /* Sweep one day, or the whole football week. The week scan only looks at
     games that haven't kicked off, which keeps it to a sane number of calls. */
  const runSweep = async (scope) => {
    if (sweeping) return;
    const whole = scope === "week";
    let games = board;

    if (whole) {
      setSweeping(true); setSweepProg([0, 0]);
      const all = [];
      for (const d of week) {
        try { all.push(...parseBoard(await espnGet(`/scoreboard?dates=${d.v}&limit=300`))); }
        catch (e) { /* a dead day shouldn't stop the rest */ }
      }
      const seen = new Set();
      games = all.filter((g) => {
        if (seen.has(g.id) || g.state !== "pre") return false;
        seen.add(g.id); return true;
      });
      setWeekGames(games);
    }

    if (!games.length) { setSweeping(false); return; }
    setSweeping(true); setSweepProg([0, games.length]);
    const r = await sweepBoard(games, (a, b) => setSweepProg([a, b]));
    setBoardOdds(r); setSweptDay(whole ? "week" : day);
    // Seed each game panel so opening one is instant rather than re-fetching
    // the summary the sweep already has.
    setEntries((prev) => {
      const next = { ...prev };
      for (const id of Object.keys(r)) {
        if (!r[id].sum) continue;
        next[id] = { ...(next[id] || {}), sum: r[id].sum };
      }
      return next;
    });
    try {
      setSweptAt(Date.now());
      await window.storage.set("linedesk:board",
        JSON.stringify({ day: whole ? "week" : day, at: Date.now(), odds: r,
                        games: whole ? games : null }));
    } catch (e) { /* stays in memory */ }
    setSweeping(false);
  };

  const week = footballWeek(now);

  /* Prices the whole week without being asked. Lines move, so it refreshes
     every 20 minutes while the app is on screen. */
  useEffect(() => {
    if (!loaded || sweeping) return;
    const stale = !sweptAt || Date.now() - sweptAt > 20 * 60000;
    const covered = sweptDay === "week" && Object.keys(boardOdds).length > 0;
    if (covered && !stale) return;
    if (sweepTried.current && !stale) return;
    sweepTried.current = true;
    const t = setTimeout(() => runSweep("week"), 400);
    return () => clearTimeout(t);
  }, [loaded, sweptAt, sweptDay, sweeping, live]);

  const shown = (() => {
    let list = board.slice();
    if (onlyMkt) list = list.filter((g) => boardOdds[g.id] && boardOdds[g.id].n > 0);
    if (sort === "gap") {
      list.sort((a, b) => {
        const ga = boardOdds[a.id] && boardOdds[a.id].gap;
        const gb = boardOdds[b.id] && boardOdds[b.id].gap;
        return (gb == null ? -1 : Math.abs(gb)) - (ga == null ? -1 : Math.abs(ga));
      });
    } else if (sort === "rank") {
      const best = (g) => Math.min(g.hR || 99, g.aR || 99);
      list.sort((a, b) => best(a) - best(b));
    } else {
      list.sort((a, b) => new Date(a.kickAt || 0) - new Date(b.kickAt || 0));
    }
    return list;
  })();

  const nextUp = [...pool, ...board]
    .filter((g) => g.kickAt && new Date(g.kickAt) > now)
    .sort((a, b) => new Date(a.kickAt) - new Date(b.kickAt))[0];

  // Live is never scoped to the date picker — a game running on Thursday
  // must show even while you're browsing Saturday.
  const loadNow = async () => {
    try {
      const g = parseBoard(await espnGet("/scoreboard?limit=300"));
      setToday(g);
    } catch (e) { /* the selected-day board still covers its own games */ }
  };

  useEffect(() => {
    if (!live) return;
    loadNow();
    const t = setInterval(loadNow, inPlay.length ? 30000 : 120000);
    return () => clearInterval(t);
  }, [live, inPlay.length]);



  return (
    <div className="fb">
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" />
      <style>{CSS}</style>
      <div className="wrap">
        <header className="hd">
          <h1>Line<em>Desk</em></h1>
          <span className="hsub">
            {tab === "card" ? "Today's card"
              : tab === "live" ? (inPlay.length ? `${inPlay.length} running now` : "Nothing live")
              : tab === "finals" ? "Results"
              : tab === "model" || tab === "top25" ? "Settings"
              : (week.find((w) => w.v === day) || {}).l || "This week"}
          </span>
        </header>

        {tab === "upcoming" && (
          <>
            <div style={{ padding: "4px 0 12px" }}>
              <Seg value={day} onChange={setDay} options={week} />
            </div>
            <div className="sweepbar">
              {Object.keys(boardOdds).length > 0 && (
                <>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                    <Seg value={sort} onChange={setSort} options={[
                      { v: "time", l: "Kickoff" },
                      { v: "gap", l: "Model gap" },
                      { v: "rank", l: "Ranked" }]} />
                    <Seg value={onlyMkt ? "y" : "n"} onChange={(v) => setOnlyMkt(v === "y")}
                      options={[{ v: "n", l: "All" }, { v: "y", l: "Priced only" }]} />
                  </div>
                  <p className="empty" style={{ paddingBottom: 0 }}>
                    {shown.length} of {board.length} shown.
                    {sort === "gap" && " Sorted by how far ESPN's projection sits from the market — the top of this list is where the disagreement is, not where the edge is."}
                  </p>
                </>
              )}
            </div>



            {autoCal === "running" && (
              <p className="empty" style={{ paddingBottom: 4 }}>
                Building team ratings from past results in the background — free, and it only
                happens once a week.
              </p>
            )}
            {autoCal === "failed" && (
              <p className="empty" style={{ paddingBottom: 4, color: "#E3B448" }}>
                Couldn't build ratings automatically. Run it yourself on the Setup tab.
              </p>
            )}
            <div className="stale" style={{ borderLeftColor: onEspn ? "#35D07F" : "#E3B448" }}>
              {onEspn ? (
                <>
                  {sweeping
                    ? <><b>Pricing the week — {sweepProg[0]} of {sweepProg[1]} games.</b> Odds,
                        injuries and both models are loading in the background; the board works
                        meanwhile.<br /><br /></>
                    : Object.keys(boardOdds).length
                      ? <><b>{Object.keys(boardOdds).length} games priced across the week</b>
                          {sweptAt ? `, ${shortAge(Date.now() - sweptAt)}` : ""} — refreshed every
                          20 minutes on its own.<br /><br /></>
                      : null}
                  <b>{board.length} games from ESPN's public feed</b> — schedule, scores, records,
                  rankings, real school colors and a book line, all keyless and free. Costs you
                  nothing and refreshes every 30 seconds once games start.
                  {espnAt && <> Updated {shortAge(Date.now() - espnAt)}.</>}
                  {" "}Open a game and the odds, injuries, form and both models load free too —
                  only the written read spends Claude usage.
                </>
              ) : (
                <>
                  <b>Running on the built-in snapshot</b>, frozen {ageText(SNAPSHOT, now)} ago.
                  {espnErr && espnErr !== "blocked" ? espnErr + " " : ""}
                  The free ESPN feed isn't answering, so schedule and scores can't move and
                  anything live costs Claude usage. The standalone build has no such limit.
                </>
              )}
            </div>

            {shown.map((g) => {
              // The sweep covers the whole week, so a game's odds apply on any day.
              const bo = boardOdds[g.id];
              const L = modelLine(g.wp);
              const fav = L == null ? null : L <= 0 ? g.hAb : g.aAb;
              return (
                <div key={g.id}>
                  <button className="gm" data-on={open === g.id ? "1" : "0"}
                    aria-expanded={open === g.id}
                    style={{ borderLeftColor: tc(g, "h") }}
                    onClick={() => setOpen(open === g.id ? null : g.id)}>
                    <span className="who">
                      <span className="abbr">
                        {g.aR ? <span className="rank" style={{ background: tc(g, "a") }}>#{g.aR}</span> : null}
                        <span style={{ color: tc(g, "a") }}>{g.aAb}</span>
                        <i>at</i>
                        {g.hR ? <span className="rank" style={{ background: tc(g, "h") }}>#{g.hR}</span> : null}
                        <span style={{ color: tc(g, "h") }}>{g.hAb}</span>
                      </span>
                      <span className="meta">
                        {g.away}{g.aRec ? ` (${g.aRec})` : ""} · {g.home}{g.hRec ? ` (${g.hRec})` : ""} · {g.kick}
                      </span>
                    </span>
                    <span className="rt">
                      {g.hs != null && g.as != null ? (
                        <>
                          <span className="line">
                            <span style={{ color: tc(g, "a") }}>{g.as}</span>
                            <span style={{ color: "#3B4453", margin: "0 5px" }}>·</span>
                            <span style={{ color: tc(g, "h") }}>{g.hs}</span>
                          </span>
                          <span className="sub">
                            {g.state === "in" ? <span className="dot" /> : null}{" "}
                            {g.detail || (g.state === "post" ? "FINAL" : "LIVE")}
                          </span>
                        </>
                      ) : bo && bo.sp != null ? (
                        <>
                          <span className="line" style={{ color: tc(g, bo.sp <= 0 ? "h" : "a") }}>
                            {bo.sp <= 0 ? g.hAb : g.aAb} −{trim(Math.abs(bo.sp))}
                          </span>
                          <span className="sub">
                            {bo.tot != null ? "O/U " + trim(bo.tot) : ""}
                            {bo.n > 1 ? " · " + bo.n + "BK" : ""}
                            {bo.gap != null && Math.abs(bo.gap) >= 3
                              ? " · GAP " + trim(Math.abs(bo.gap)) : ""}
                          </span>
                        </>
                      ) : L != null ? (
                        <>
                          <span className="line" style={{ color: col(fav) }}>
                            {fav} −{trim(Math.abs(L))}
                          </span>
                          <span className="sub">{g.wp}% MODEL</span>
                        </>
                      ) : (
                        <>
                          <span className="line none">—</span>
                          <span className="sub">NO LINE YET</span>
                        </>
                      )}
                    </span>
                  </button>
                  {open === g.id && (
                    <Insight game={g} entry={entries[g.id] || {}} patch={patch(g.id)} />
                  )}
                </div>
              );
            })}
          </>
        )}

        {tab === "finals" && (
          <>
            <p className="empty">Saturday, August 29. For grading numbers after the fact.</p>
            {FINALS.map((g) => {
              const hw = g.hs > g.as;
              return (
                <div className="gm" key={g.id} style={{ borderLeftColor: col(hw ? g.hAb : g.aAb), cursor: "default" }}>
                  <span className="who">
                    <span className="abbr">
                      <span style={{ color: col(g.aAb) }}>{g.aAb}</span>
                      <i>at</i>
                      <span style={{ color: col(g.hAb) }}>{g.hAb}</span>
                    </span>
                    <span className="meta">{hw ? g.hAb : g.aAb} by {Math.abs(g.hs - g.as)} · {g.hs + g.as} total</span>
                  </span>
                  <span className="rt">
                    <span className="line">
                      <span style={{ color: col(g.aAb) }}>{g.as}</span>
                      <span style={{ color: "#3B4453", margin: "0 5px" }}>·</span>
                      <span style={{ color: col(g.hAb) }}>{g.hs}</span>
                    </span>
                    <span className="sub">FINAL</span>
                  </span>
                </div>
              );
            })}
          </>
        )}

        {tab === "live" && (
          <>
            {inPlay.length === 0 ? (
              <div className="stale" style={{ borderLeftColor: "#7E8899" }}>
                Nothing kicking off right now.
                {nextUp && <> Next up is <b>{nextUp.away} at {nextUp.home}</b>, {untilKick(nextUp.kickAt, now)} away.</>}
                {" "}Scores appear here automatically once a game starts.
              </div>
            ) : (
              <>
                <div className="stale" style={{ borderLeftColor: "#FF5A47" }}>
                  Scores, possession, down and distance and the box score all come straight from
                  ESPN, refreshed every 30 seconds while games are running. Still a few seconds behind the broadcast, so{" "}
                  <b>don't live bet off them</b> — anyone watching the feed sees the play first.
                  {espnAt && <> Updated {shortAge(Date.now() - espnAt)}.</>}
                </div>
                {inPlay.map((g) => {
                  const sc = g.hs != null && g.as != null ? g : null;
                  const hasBall = g.sit && g.sit.poss
                    ? (String(g.sit.poss) === String(g.hId) ? "h"
                      : String(g.sit.poss) === String(g.aId) ? "a" : null)
                    : null;
                  const isOpen = openLive === g.id;
                  return (
                    <div key={g.id}>
                      <button className="gm" style={{ borderLeftColor: tc(g, "h") }}
                        aria-expanded={isOpen}
                        onClick={() => setOpenLive(isOpen ? null : g.id)}>
                        <span className="who">
                          <span className="abbr">
                            {hasBall === "a" && <span className="pball">•</span>}
                            <span style={{ color: tc(g, "a") }}>{g.aAb}</span>
                            <i>at</i>
                            {hasBall === "h" && <span className="pball">•</span>}
                            <span style={{ color: tc(g, "h") }}>{g.hAb}</span>
                          </span>
                          <span className="meta">
                            {sc ? <><span className="dot" /> {g.detail || "in progress"}</>
                                : "waiting on a score"}
                          </span>
                          {g.sit && (g.sit.down || g.sit.last) && (
                            <span className="sitline">
                              {g.sit.red && <span className="red">RED ZONE · </span>}
                              {g.sit.down || ""}{g.sit.spot ? " · " + g.sit.spot : ""}
                              {g.sit.last && <><br />{g.sit.last}</>}
                            </span>
                          )}
                        </span>
                        <span className="rt">
                          {sc ? (
                            <span className="line">
                              <span style={{ color: tc(g, "a") }}>{sc.as}</span>
                              <span style={{ color: "#3B4453", margin: "0 5px" }}>·</span>
                              <span style={{ color: tc(g, "h") }}>{sc.hs}</span>
                            </span>
                          ) : <span className="line none">—</span>}
                          <span className="sub">{isOpen ? "HIDE STATS" : "TAP FOR STATS"}</span>
                        </span>
                      </button>
                      {isOpen && <LiveGame game={g} live={live} />}
                    </div>
                  );
                })}
              </>
            )}
          </>
        )}

        {tab === "record" && <RecordTab log={log} setLog={setLog} />}

        {tab === "card" && (
          <CardTab
            board={sweptDay === "week" && weekGames.length ? weekGames : board}
            boardOdds={boardOdds}
            entries={entries} sweeping={sweeping} prog={sweepProg}
            runSweep={runSweep} day={day} scope={sweptDay} logPicks={logPicks}
            onOpen={(id) => { setTab("upcoming"); setOpen(id); }} />
        )}
        {(tab === "model" || tab === "top25") && (
          <>
            <div style={{ padding: "4px 0 14px" }}>
              <Seg value={tab} onChange={setTab} options={[
                { v: "model", l: "Model" }, { v: "top25", l: "Top 25" }]} />
            </div>
            {tab === "model" && (
              <><ModelTab emp={emp} setEmp={setEmp} />
                <PaceBox pace={pace} setPace={setPace} />
                <KeyBox /></>
            )}
            {tab === "top25" && <Top25 />}
          </>
        )}

        <nav className="nav" role="tablist">
          {[
            { k: "upcoming", l: "Board", d: "M3 5h18M3 12h18M3 19h18" },
            { k: "card", l: "Card", d: "M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.9 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z" },
            { k: "live", l: "Live", d: "M12 8a4 4 0 100 8 4 4 0 000-8M5 5a10 10 0 000 14M19 5a10 10 0 010 14", badge: inPlay.length },
            { k: "record", l: "Record", d: "M4 19V5m0 14h16M8 15V9m4 6V6m4 9v-4" },
            { k: "model", l: "Setup", d: "M12 9a3 3 0 100 6 3 3 0 000-6M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008.9 19a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 8.9a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z", alert: !emp },
          ].map((t) => {
            const on = t.k === "model" ? (tab === "model" || tab === "top25") : tab === t.k;
            return (
              <button key={t.k} role="tab" aria-selected={on} data-on={on ? "1" : "0"}
                onClick={() => { setTab(t.k); setOpen(null); }}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
                  strokeLinecap="round" strokeLinejoin="round"><path d={t.d} /></svg>
                <span>{t.l}</span>
                {t.badge ? <i className="bdg">{t.badge}</i> : null}
                {t.alert ? <i className="bdg warn">!</i> : null}
              </button>
            );
          })}
        </nav>

        <div className="ft">
          <p>Expected value is measured against the other books loaded for that game — Pinnacle
            alone when it's among them, the average otherwise. A positive number means one book
            is off the market, not that the market is wrong. Prices are de-vigged with a power
            solve rather than proportional scaling, which matters on heavy favorites.</p>
          <p>Spreads are priced off a discrete margin distribution — a normal shape ({SIG_M}
            points) reweighted so 3 and 7 carry the extra mass they carry in real games —
            and pushes on whole numbers are counted as returned stakes rather than ignored.
            The weightings start as estimates shaped from how FBS results generally fall; run
            the calibration on the Model tab and they're replaced with weights measured from
            real finished games. Totals still use a plain curve ({SIG_T} points); key totals exist but
            are far weaker than key spreads.</p>
          <p>School colors come from ESPN, lifted in lightness where the real hex would be
            unreadable on a dark screen. Odds and notes are saved on this device. If betting has stopped being fun,
            1-800-GAMBLER is free and confidential.</p>
        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { window.__ldError(err); }
  render() { return this.state.err ? null : this.props.children; }
}
ReactDOM.createRoot(document.getElementById("root"))
  .render(<ErrorBoundary><LineDesk /></ErrorBoundary>);
} catch (e) { window.__ldError(e); }
})();
</script>
<script>
  // Registered after load so it never delays first paint.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {
        /* offline support is a bonus, not a requirement */
      });
    });
  }
  window.addEventListener("online", function () { document.body.dataset.net = "on"; });
  window.addEventListener("offline", function () { document.body.dataset.net = "off"; });
</script>
</body>
</html>
